# Supabase local development config (optional — use `supabase start` when Docker is available)

project_id = "ai-employee-platform"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Pushed to the live project with `supabase config push`; links in auth emails use site_url.
site_url = "https://voice-agent-chi-nine.vercel.app"
additional_redirect_urls = ["https://voice-agent-chi-nine.vercel.app/**", "http://localhost:3000/**"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
